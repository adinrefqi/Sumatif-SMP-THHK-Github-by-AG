name: Build Android APK (Flutter & Native WebView)

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-flutter-apk:
    name: Build Flutter Exambrowser APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Decode Release Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          # Gagal keras, jangan diam-diam turun ke debug key: build.gradle memakai
          # `keystorePropertiesFile.exists() ? release : debug`, jadi secret yang
          # kosong akan menghasilkan APK debug-signed yang terlihat sukses.
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Secret KEYSTORE_BASE64 kosong. Set KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_PASSWORD, KEY_ALIAS di Settings -> Secrets and variables -> Actions."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > flutter_app/android/upload-keystore.jks
          cat > flutter_app/android/key.properties <<EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=upload-keystore.jks
          EOF

      - name: Install Dependencies
        run: |
          cd flutter_app
          flutter pub get

      - name: Build Flutter APK
        run: |
          cd flutter_app
          flutter build apk --release --no-tree-shake-icons
          cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/SMP-THHK-Exambrowser.apk

      - name: Upload Flutter APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SMP-THHK-Exambrowser-Flutter-APK
          path: flutter_app/build/app/outputs/flutter-apk/SMP-THHK-Exambrowser.apk

      - name: Create Release & Attach Signed APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "SMP THHK Exambrowser Signed Release v1.0.${{ github.run_number }}"
          body: |
            ### 📱 Aplikasi Exambrowser SMP THHK Tegal (Versi Signed Release)
            - **Versi**: v1.0.${{ github.run_number }}
            - **Fitur Utama**: Multi-Active Exams, Tepat 3 Ruang Ujian (Ruang 1, 2, 3), Presensi TTD Digital, Berita Acara Proktor, Kiosk Security Lock, & Logo Resmi SMP THHK Tegal.
            - **File**: `SMP-THHK-Exambrowser.apk` (Signed Official Release)
          files: |
            flutter_app/build/app/outputs/flutter-apk/SMP-THHK-Exambrowser.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}