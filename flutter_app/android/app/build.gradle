plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file("local.properties")
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader("UTF-8") { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty("flutter.versionCode") ?: "1"
def flutterVersionName = localProperties.getProperty("flutter.versionName") ?: "1.0"

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace = "id.sch.smpthhk.exambrowser"
    compileSdk = 36
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    signingConfigs {
        release {
            def kFile = rootProject.file('key.properties')
            if (!kFile.exists()) {
                kFile = file('key.properties')
            }
            if (kFile.exists()) {
                try {
                    def props = new Properties()
                    props.load(new FileInputStream(kFile))
                    keyAlias props['keyAlias'].toString().trim()
                    keyPassword props['keyPassword'].toString().trim()
                    storePassword props['storePassword'].toString().trim()

                    def ksName = props['storeFile'].toString().trim()
                    def ksFile = rootProject.file("app/${ksName}")
                    if (!ksFile.exists()) {
                        ksFile = rootProject.file(ksName)
                    }
                    if (!ksFile.exists()) {
                        ksFile = file(ksName)
                    }
                    storeFile ksFile
                } catch (Exception e) {
                    println("Keystore loading warning: " + e.message)
                }
            }
        }
    }

    defaultConfig {
        applicationId = "id.sch.smpthhk.exambrowser"
        // You can update the following values to match your application needs.
        // For more information, see: https://docs.flutter.dev/deployment/android#reviewing-the-gradle-build-configuration.
        minSdk = 24
        targetSdk = 34
        versionCode = flutterVersionCode.toInteger()
        versionName = flutterVersionName
    }

    buildTypes {
        release {
            signingConfig = keystorePropertiesFile.exists() ? signingConfigs.release : signingConfigs.debug
        }
    }
}

flutter {
    source = "../.."
}