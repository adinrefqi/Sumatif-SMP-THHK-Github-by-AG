name: smp_thhk_exambrowser
description: "Exambrowser Android Flutter App for SMP THHK Sumatif Exam"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_inappwebview: any
  kiosk_mode: any
  audioplayers: any
  battery_plus: any
  cupertino_icons: any

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png